  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { moveThumb('tod-seg'); readMapColors(); labelElements.forEach((l) => { l.w = l.el.firstChild.offsetWidth || 90; l.h = l.el.firstChild.offsetHeight || 24; }); });
  setTimeout(dismissHint, 9000);
  requestAnimationFrame(animate);
})();

// =========================================================================
// HOME — splash → Taiwan county map → county close-up → school (3D view)
// Routes: #/  ·  #/c/<county>  ·  #/s/<schoolId>
// =========================================================================
(function () {
  const homeEl = document.getElementById('home');
  const mapWrap = document.getElementById('hmap');
  const splash = document.getElementById('splash');
  const NS = 'http://www.w3.org/2000/svg';
  const HS = { sys: 'all', showGone: true, county: null, hoverCounty: null, hotSchool: null };
  const PALETTE = ['#F2B263', '#8EC5A4', '#86B7E8', '#E89A9A', '#C7A8E3', '#E8C76A', '#7FC9C4', '#F0A27A'];
  const STATUS_TXT = { closed: '已停辦', merged: '已合併', stopping: '停招中' };
  window.HOME_OPEN = true;

  // ---------- projection (same as the generator) ----------
  const P = TW_MAP.proj;
  const CBY = Object.fromEntries(TW_MAP.counties.map((c, i) => [c.name, Object.assign(c, { i, col: PALETTE[i % PALETTE.length] })]));
  function project(s) {
    let x = (s.lon - P.lon0) * P.c * P.k, y = (P.lat0 - s.lat) * P.k;
    const c = CBY[s.county];
    if (c && c.inset) { x = x * c.inset.s + c.inset.ox; y = y * c.inset.s + c.inset.oy; }
    return [x, y];
  }
  SCHOOL_LIST.forEach((s) => { if (s.lat != null) [s.x, s.y] = project(s); s.gone = s.status === 'closed' || s.status === 'merged'; });
  const visible = (s) => (HS.sys === 'all' || s.sys === HS.sys) && (HS.showGone || !s.gone) && s.x != null;

  // ---------- build SVG ----------
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', '臺灣各縣市大專院校分布圖');
  const defs = document.createElementNS(NS, 'defs');
  const gC = document.createElementNS(NS, 'g'), gLift = document.createElementNS(NS, 'g'), gIns = document.createElementNS(NS, 'g');
  const gLbl = document.createElementNS(NS, 'g'), gDots = document.createElementNS(NS, 'g');
  gLift.id = 'lift'; gDots.setAttribute('class', 'dots'); gLbl.setAttribute('class', 'clbls');
  svg.append(defs, gIns, gC, gLift, gLbl, gDots);
  TW_MAP.counties.forEach((c) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', c.d); p.id = 'cty-' + c.i; p.classList.add('county'); p.style.setProperty('--cc', c.col);
    p.dataset.name = c.name;
    p.addEventListener('pointerenter', () => hoverCounty(c.name));
    p.addEventListener('pointerleave', () => hoverCounty(null));
    p.addEventListener('click', () => { if (!HS.county) go('#/c/' + encodeURIComponent(c.name)); });
    gC.appendChild(p); c.el = p;
    const u = document.createElementNS(NS, 'path');
    u.setAttribute('d', c.d); u.style.setProperty('--cc', c.col);
    gLift.appendChild(u); c.use = u;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'clbl'); t.setAttribute('text-anchor', 'middle'); t.textContent = c.name;
    gLbl.appendChild(t); c.lbl = t;
    if (c.inset) {
      const [x0, y0, x1, y1] = c.inset.box;
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('class', 'inset-box'); r.setAttribute('x', x0); r.setAttribute('y', y0); r.setAttribute('width', x1 - x0); r.setAttribute('height', y1 - y0); r.setAttribute('rx', 8);
      const tl = document.createElementNS(NS, 'text'); tl.setAttribute('class', 'inset-lbl'); tl.setAttribute('x', x0 + 8); tl.setAttribute('y', y0 + 16); tl.textContent = c.name;
      gIns.append(r, tl); c.insetEls = [r, tl];
    }
  });
  SCHOOL_LIST.forEach((s) => {
    if (s.x == null) return;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'sdot' + (s.gone ? ' gone' : '') + (s.ready ? ' ready' : ''));
    g.style.setProperty('--sc', s.gone ? 'var(--muted)' : s.sys === 'tech' ? 'var(--c-tech)' : 'var(--c-gen)');
    const mark = document.createElementNS(NS, s.ready ? 'rect' : 'circle');
    if (s.ready) mark.style.fill = 'var(--accent)';
    const t = document.createElementNS(NS, 'text'); t.textContent = s.name;
    g.append(mark, t);
    g.addEventListener('pointerenter', () => hotSchool(s.id, true));
    g.addEventListener('pointerleave', () => hotSchool(s.id, false));
    g.addEventListener('click', (e) => { e.stopPropagation(); if (!HS.county) { go('#/c/' + encodeURIComponent(s.county)); return; } go('#/s/' + s.id); });
    gDots.appendChild(g); s.el = g; s.mark = mark; s.txt = t;
  });
  mapWrap.appendChild(svg);

  // ---------- viewBox animation ----------
  let VB = TW_MAP.viewBox.slice(), vbAnim = null, animating = false;
  function fitRect() {
    const W = mapWrap.clientWidth, H = mapWrap.clientHeight;
    if (W <= 900) return [10, 84, W - 10, H - Math.min(H * 0.44, 380)];
    return [372, 84, W - 24, H - 24];
  }
  function targetVB(bb, pad) {
    const W = mapWrap.clientWidth || 1, H = mapWrap.clientHeight || 1;
    const R = fitRect(), rw = R[2] - R[0], rh = R[3] - R[1];
    const bw = (bb[2] - bb[0]) * (1 + pad * 2), bh = (bb[3] - bb[1]) * (1 + pad * 2);
    const s = Math.min(rw / bw, rh / bh);
    const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2;
    return [cx - (R[0] + rw / 2) / s, cy - (R[1] + rh / 2) / s, W / s, H / s];
  }
  function setVB(v, live) { VB = v; svg.setAttribute('viewBox', v.map((n) => n.toFixed(2)).join(' ')); if (!live) sizeMarks(); }
  function animateVB(to, ms = 760) {
    const from = VB.slice(), t0 = performance.now();
    cancelAnimationFrame(vbAnim); animating = true;
    svg.classList.add('moving');   // markers & labels sit out the zoom: re-sizing 180 of them per frame is what made it stutter
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / ms), k = ease(t);
      setVB(from.map((f, i) => f + (to[i] - f) * k), t < 1);
      if (t < 1) vbAnim = requestAnimationFrame(step); else { animating = false; layoutSchoolLabels(); svg.classList.remove('moving'); }
    };
    vbAnim = requestAnimationFrame(step);
  }
  function unitPx() { return VB[2] / (mapWrap.clientWidth || 1); }   // map units per screen pixel

  function sizeMarks() {
    const u = unitPx(), inCounty = !!HS.county;
    const r = (inCounty ? 5.2 : 2.7) * u;
    SCHOOL_LIST.forEach((s) => {
      if (!s.el) return;
      if (s.ready) {
        const a = r * 1.5;
        s.mark.setAttribute('x', s.x - a / 2); s.mark.setAttribute('y', s.y - a / 2); s.mark.setAttribute('width', a); s.mark.setAttribute('height', a);
        s.mark.setAttribute('transform', `rotate(45 ${s.x} ${s.y})`);
      } else { s.mark.setAttribute('cx', s.x); s.mark.setAttribute('cy', s.y); s.mark.setAttribute('r', r); }
      s.el.style.setProperty('--rh', (r * 1.5) + 'px');
      const left = s.side === 'L';
      s.txt.setAttribute('x', s.x + (left ? -1 : 1) * r * 1.8); s.txt.setAttribute('y', s.y + 3.6 * u);
      s.txt.setAttribute('text-anchor', left ? 'end' : 'start'); s.txt.style.fontSize = (11.5 * u) + 'px';
      s.txt.style.strokeWidth = (3 * u) + 'px';
    });
    TW_MAP.counties.forEach((c) => {
      c.lbl.setAttribute('x', c.c[0]); c.lbl.setAttribute('y', c.c[1]);
      c.lbl.style.fontSize = (13 * u) + 'px'; c.lbl.style.strokeWidth = (3.5 * u) + 'px';
    });
  }

  // label decluttering inside a county (screen-space greedy)
  function layoutSchoolLabels() {
    const placed = [];
    const u = unitPx();
    const list = SCHOOL_LIST.filter((s) => s.el && HS.county === s.county && visible(s));
    list.sort((a, b) => (b.ready - a.ready) || (a.gone - b.gone) || a.name.length - b.name.length);
    const dots = list.map((s) => { const x = (s.x - VB[0]) / u, y = (s.y - VB[1]) / u; return [x - 5, y - 5, x + 5, y + 5, s]; });
    const ov = (r, q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1];
    list.forEach((s) => {
      const x = (s.x - VB[0]) / u, y = (s.y - VB[1]) / u, w = s.name.length * 11.5 + 10, h = 15;
      const cands = [['R', [x + 6, y - h / 2, x + w, y + h / 2]], ['L', [x - w, y - h / 2, x - 6, y + h / 2]]];
      const free = (r) => r[0] > 0 && !placed.some((q) => ov(r, q)) && !dots.some((q) => q[4] !== s && ov(r, q));
      let pick = cands.find(([, r]) => free(r));
      if (!pick && s.ready) pick = cands.find(([, r]) => !placed.some((q) => ov(r, q))) || cands[0];
      s.side = pick ? pick[0] : 'R';
      s.el.classList.toggle('lbl', !!pick);
      if (pick) placed.push(pick[1]);
    });
    sizeMarks();
    SCHOOL_LIST.forEach((s) => { if (s.el && !(HS.county === s.county && visible(s))) s.el.classList.remove('lbl'); });
  }

  // ---------- hover ----------
  function hoverCounty(name) {
    if (HS.county) return;
    HS.hoverCounty = name;
    TW_MAP.counties.forEach((c) => {
      const on = c.name === name;
      if (on) gLift.appendChild(c.use);
      c.use.classList.toggle('up', on);
      c.lbl.classList.toggle('on', on);
    });
    document.querySelectorAll('.crow[data-county]').forEach((r) => r.classList.toggle('hot', r.dataset.county === name));
  }
  function hotSchool(id, on) {
    const s = SCHOOL_LIST.find((x) => x.id === id); if (!s || !s.el || (on && animating)) return;
    s.el.classList.toggle('hot', on);
    if (on) gDots.appendChild(s.el);
    document.querySelectorAll('.srow').forEach((r) => r.classList.toggle('hot', on && r.dataset.id === id));
  }

  // ---------- side panel ----------
  const listEl = document.getElementById('hs-list');
  function statusTag(s) {
    if (s.gone || s.status === 'stopping') return `<span class="tag ${s.status}">${STATUS_TXT[s.status]}</span>`;
    return s.ready ? '<span class="tag ok">3D 完成</span>' : '<span class="tag soon">施工中</span>';
  }
  function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function renderSide() {
    const vis = SCHOOL_LIST.filter(visible);
    const crumb = document.getElementById('crumb');
    document.getElementById('h-back').hidden = !HS.county;
    if (!HS.county) {
      crumb.innerHTML = '<b>全臺灣</b><span>・選一個縣市開始</span>';
      document.getElementById('hs-title').textContent = '全臺灣';
      const act = vis.filter((s) => !s.gone).length;
      document.getElementById('hs-sub').textContent = '依縣市瀏覽大專院校，滑過列表或地圖可預覽。';
      document.getElementById('hs-stats').innerHTML =
        `<span class="stat"><b>${act}</b>所現存</span>` + (HS.showGone ? `<span class="stat"><b>${vis.length - act}</b>所已退場／合併</span>` : '') +
        `<span class="stat"><b>${vis.filter((s) => s.ready).length}</b>所 3D 完成</span>`;
      const counts = {};
      vis.forEach((s) => { counts[s.county] = (counts[s.county] || 0) + 1; });
      const rows = TW_MAP.counties.slice().sort((a, b) => (counts[b.name] || 0) - (counts[a.name] || 0) || a.name.localeCompare(b.name, 'zh-Hant'));
      listEl.innerHTML = rows.map((c) => `<button type="button" class="crow" data-county="${c.name}" style="--c:${c.col}"><span class="sw"></span><span class="t"><b>${c.name}</b><small>${c.en}</small></span><span class="n">${counts[c.name] || 0} 所</span></button>`).join('');
      listEl.querySelectorAll('.crow').forEach((r) => {
        r.addEventListener('pointerenter', () => hoverCounty(r.dataset.county));
        r.addEventListener('pointerleave', () => hoverCounty(null));
        r.addEventListener('click', () => go('#/c/' + encodeURIComponent(r.dataset.county)));
      });
    } else {
      const c = CBY[HS.county];
      crumb.innerHTML = `<button type="button" data-home>全臺灣</button><span>›</span><b>${esc(c.name)}</b>`;
      crumb.querySelector('[data-home]').addEventListener('click', () => go('#/'));
      document.getElementById('hs-title').textContent = c.name;
      const mine = vis.filter((s) => s.county === c.name);
      document.getElementById('hs-sub').textContent = mine.length ? '點學校名稱進入 3D 校園地圖。' : '這個條件下沒有學校，試試切換體系或勾選「含已退場」。';
      const act = mine.filter((s) => !s.gone).length;
      document.getElementById('hs-stats').innerHTML = `<span class="stat"><b>${mine.filter((s) => s.sys === 'tech').length}</b>技職</span><span class="stat"><b>${mine.filter((s) => s.sys === 'general').length}</b>一般</span>` +
        (mine.length - act ? `<span class="stat"><b>${mine.length - act}</b>已退場／合併</span>` : '');
      const grp = (sys, label) => {
        const arr = mine.filter((s) => s.sys === sys).sort((a, b) => (a.gone - b.gone) || (b.ready - a.ready) || (a.pub === b.pub ? 0 : a.pub === '公立' ? -1 : 1) || a.name.localeCompare(b.name, 'zh-Hant'));
        if (!arr.length) return '';
        return `<div class="hgroup eyebrow">${label}・${arr.length}</div>` + arr.map((s) => {
          const sub = s.gone || s.status === 'stopping' ? s.note : (s.former && s.former.length ? '原名 ' + s.former.join('、') : (s.pub || '') + (s.addr ? '・' + s.addr.replace(/^\d+/, '') : ''));
          return `<button type="button" class="crow srow${s.gone ? ' is-gone' : ''}" data-id="${s.id}" style="--sc:${s.gone ? 'var(--muted)' : s.sys === 'tech' ? 'var(--c-tech)' : 'var(--c-gen)'}"><span class="dot"></span><span class="t"><b>${esc(s.name)}</b><small title="${esc(sub)}">${esc(sub)}</small></span>${statusTag(s)}</button>`;
        }).join('');
      };
      listEl.innerHTML = (HS.sys !== 'general' ? grp('tech', '技職體系') : '') + (HS.sys !== 'tech' ? grp('general', '一般大學') : '');
      listEl.querySelectorAll('.srow').forEach((r) => {
        r.addEventListener('pointerenter', () => hotSchool(r.dataset.id, true));
        r.addEventListener('pointerleave', () => hotSchool(r.dataset.id, false));
        r.addEventListener('click', () => go('#/s/' + r.dataset.id));
      });
    }
    listEl.scrollTop = 0;
  }

  function applyMapState(animate) {
    const inC = !!HS.county;
    TW_MAP.counties.forEach((c) => {
      const me = c.name === HS.county;
      c.el.classList.toggle('dim', inC && !me);
      c.el.classList.toggle('sel', me);
      c.use.classList.remove('up');
      c.lbl.classList.toggle('on', false);
      if (c.insetEls) c.insetEls.forEach((e) => { e.style.opacity = inC ? 0 : 1; });
    });
    SCHOOL_LIST.forEach((s) => {
      if (!s.el) return;
      const show = visible(s) && (!inC || s.county === HS.county);
      s.el.classList.toggle('hide', !show);
      s.el.classList.remove('lbl', 'hot');
    });
    document.getElementById('map-hint').classList.toggle('gone', inC);
    const bb = inC ? CBY[HS.county].bb : [TW_MAP.viewBox[0], TW_MAP.viewBox[1], TW_MAP.viewBox[0] + TW_MAP.viewBox[2], TW_MAP.viewBox[1] + TW_MAP.viewBox[3]];
    const to = targetVB(bb, inC ? 0.08 : 0.0);
    if (animate) animateVB(to); else { setVB(to); layoutSchoolLabels(); }
  }

  // ---------- controls ----------
  document.querySelectorAll('#sys-seg [data-sys]').forEach((b) => b.addEventListener('click', () => {
    HS.sys = b.dataset.sys;
    document.querySelectorAll('#sys-seg [data-sys]').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    moveThumb('sys-seg'); renderSide(); applyMapState(false);
  }));
  document.getElementById('show-gone').addEventListener('change', (e) => { HS.showGone = e.target.checked; renderSide(); applyMapState(false); });
  document.getElementById('h-back').addEventListener('click', () => go('#/'));
  svg.addEventListener('click', (e) => { if (HS.county && (e.target === svg || e.target.classList.contains('county'))) { if (e.target.dataset && e.target.dataset.name === HS.county) return; go('#/'); } });
  window.addEventListener('resize', () => { if (!homeEl.classList.contains('gone')) applyMapState(false); moveThumb('sys-seg'); });

  // ---------- router ----------
  function go(h) { if (location.hash === h) route(); else location.hash = h; }
  window.homeGo = go;
  function showHome(on) {
    homeEl.classList.toggle('gone', !on);
    window.HOME_OPEN = on;
  }
  let first = true;
  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ''));
    const m = h.match(/^\/s\/(.+)$/), mc = h.match(/^\/c\/(.+)$/);
    if (m && typeof SCHOOL !== 'undefined' && SCHOOL[m[1]]) {
      const s = SCHOOL_LIST.find((x) => x.id === m[1]);
      if (s) HS.county = s.county;
      showHome(false);
      if (state.uniId !== m[1] || first) switchUniversity(m[1]);
      first = false;
      return;
    }
    HS.county = mc && CBY[mc[1]] ? mc[1] : null;
    const wasHidden = homeEl.classList.contains('gone');
    showHome(true);
    if (state.droneOrbit) toggleDroneTour(false);
    renderSide();
    applyMapState(!first && !wasHidden);
    first = false;
  }
  window.addEventListener('hashchange', route);

  // ---------- start ----------
  requestAnimationFrame(() => {
    route();
    moveThumb('sys-seg');
    const done = () => { splash.classList.add('out'); setTimeout(() => splash.remove(), 1200); };
    setTimeout(done, matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 1900);
    setTimeout(() => document.getElementById('map-hint').classList.add('gone'), 9000);
  });
})();


// ---------- magnetic controls ----------
// Every button (and the 3D pins) leans toward the cursor and springs back when it leaves.
// Uses the individual `translate` property so it stacks on top of whatever `transform` the element already has.
(function magnet() {
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const SEL = 'button, .chk, .pin-body';
  const live = new Map();
  let cur = null, raf = 0;
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));

  function track(el, e) {
    let st = live.get(el);
    if (!st) {
      st = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, thumb: null };
      const seg = el.parentElement && el.parentElement.classList.contains('seg') ? el.parentElement : null;
      if (seg && el.getAttribute('aria-checked') === 'true') st.thumb = seg.querySelector('.seg-thumb');
      live.set(el, st); el.classList.add('mag-on');
    }
    const r = el.getBoundingClientRect();
    const left = r.left - st.x, top = r.top - st.y;             // layout box without our own offset
    const big = Math.max(r.width, r.height);
    const k = big > 160 ? 0.05 : big > 80 ? 0.14 : 0.32;        // wide list rows barely move, round buttons pull hard
    const m = big > 160 ? 3 : big > 80 ? 5 : 8;
    st.tx = clamp((e.clientX - left - r.width / 2) * k, m);
    st.ty = clamp((e.clientY - top - r.height / 2) * k, m * 0.75);
    el.style.setProperty('--gx', (((e.clientX - left) / r.width) * 100).toFixed(1) + '%');
    el.style.setProperty('--gy', (((e.clientY - top) / r.height) * 100).toFixed(1) + '%');
    kick();
  }
  function release(el) {
    const st = live.get(el);
    if (st) { st.tx = 0; st.ty = 0; kick(); }
    el.style.removeProperty('--gx'); el.style.removeProperty('--gy');
  }
  function step() {
    raf = 0;
    let busy = false;
    live.forEach((st, el) => {
      st.vx = (st.vx + (st.tx - st.x) * 0.22) * 0.66;             // damped spring: a little overshoot on release
      st.vy = (st.vy + (st.ty - st.y) * 0.22) * 0.66;
      st.x += st.vx; st.y += st.vy;
      const still = Math.abs(st.tx - st.x) < 0.04 && Math.abs(st.ty - st.y) < 0.04 && Math.abs(st.vx) < 0.04 && Math.abs(st.vy) < 0.04;
      if (still) { st.x = st.tx; st.y = st.ty; st.vx = st.vy = 0; }
      const v = st.x || st.y ? `${st.x.toFixed(2)}px ${st.y.toFixed(2)}px` : '';
      el.style.translate = v;
      if (st.thumb) st.thumb.style.translate = v;
      if (still && !st.tx && !st.ty) { live.delete(el); el.classList.remove('mag-on'); return; }
      if (!still) busy = true;
    });
    if (busy) kick();
  }
  function kick() { if (!raf) raf = requestAnimationFrame(step); }

  document.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    const el = e.target.closest ? e.target.closest(SEL) : null;
    if (cur && cur !== el) release(cur);
    cur = el && !el.disabled ? el : null;
    if (cur) track(cur, e);
  }, { passive: true });
  document.addEventListener('pointerout', (e) => { if (!e.relatedTarget && cur) { release(cur); cur = null; } });
  window.addEventListener('blur', () => { if (cur) { release(cur); cur = null; } });
})();

</script>
