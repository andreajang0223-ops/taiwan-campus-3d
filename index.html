<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>大專院校 3D 校園地圖</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='t' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23FFC163'/><stop offset='.55' stop-color='%23F08A12'/><stop offset='1' stop-color='%23C85E00'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23t)'/><g transform='translate(4 4)'><path d='M6.6 9.6 12 12.4 17.4 9.6V14.1c0 1.7-2.4 3-5.4 3s-5.4-1.3-5.4-3Z' fill='%23fff' fill-opacity='.72'/><path d='M12 3.4 21.2 7.9 12 12.4 2.8 7.9Z' fill='%23fff'/><path d='M12 7.9 19.4 9.7V15' stroke='%23fff' stroke-width='1.2' fill='none' stroke-linecap='round'/><path d='M18.5 15h1.8l.45 3.2h-2.7Z' fill='%23fff'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed WebGL campus under a few glass panels — brand + school picker (top-left), scene tools (top-right),
   building directory (left), building card (right), camera rail (bottom), plan map (bottom-right).
   The scene's time of day (day / sunset / night) drives the shell's light or dark palette. */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --ba{syntax:'<angle>';inherits:true;initial-value:-250deg}

:root{
  --bg:#DDE1E6; --panel:#F8F9FA; --raise:#FFFFFF; --ink:#15181C; --muted:#59616B; --line:#D3D8DE;
  --accent:#E07B00; --accent-ink:#A35600; --accent-soft:rgba(224,123,0,.14);
  --hi:rgba(255,255,255,.75); --glow:rgba(255,160,30,.5);
  --shadow:0 1px 2px rgba(20,24,28,.06),0 14px 34px -10px rgba(20,24,28,.22);
  --map-bg:#EEF0F2; --map-turf:#CFDCC6; --map-road:#A2A9B3; --map-text:#59616B; --map-water:#9CC7DE; --map-bld:#B9BEC5;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --f-display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#16191D; --raise:#20242A; --ink:#E8EBEE; --muted:#98A1AB; --line:#2C323A;
  --accent:#FFA53A; --accent-ink:#FFB862; --accent-soft:rgba(255,165,58,.15);
  --hi:rgba(255,255,255,.07); --glow:rgba(130,150,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65);
  --map-bg:#0F1114; --map-turf:#1A271F; --map-road:#3A414B; --map-text:#98A1AB; --map-water:#1F4A66; --map-bld:#3A4049; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#16191D; --raise:#20242A; --ink:#E8EBEE; --muted:#98A1AB; --line:#2C323A;
  --accent:#FFA53A; --accent-ink:#FFB862; --accent-soft:rgba(255,165,58,.15);
  --hi:rgba(255,255,255,.07); --glow:rgba(130,150,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65);
  --map-bg:#0F1114; --map-turf:#1A271F; --map-road:#3A414B; --map-text:#98A1AB; --map-water:#1F4A66; --map-bld:#3A4049; color-scheme:dark}

/* the scene's time of day decides the shell palette */
.app[data-scene="day"],.app[data-scene="sunset"]{
  --bg:#DDE1E6; --panel:#F8F9FA; --raise:#FFFFFF; --ink:#15181C; --muted:#59616B; --line:#D3D8DE;
  --accent:#E07B00; --accent-ink:#A35600; --accent-soft:rgba(224,123,0,.14);
  --hi:rgba(255,255,255,.75); --glow:rgba(255,160,30,.5);
  --shadow:0 1px 2px rgba(20,24,28,.06),0 14px 34px -10px rgba(20,24,28,.22);
  --map-bg:#EEF0F2; --map-turf:#CFDCC6; --map-road:#A2A9B3; --map-text:#59616B; --map-water:#9CC7DE; --map-bld:#B9BEC5; color-scheme:light}
.app[data-scene="sunset"]{--bg:#E7D3C3; --glow:rgba(255,110,40,.5); --map-turf:#D9D6BE}
.app[data-scene="night"]{
  --bg:#111317; --panel:#16191D; --raise:#20242A; --ink:#E8EBEE; --muted:#98A1AB; --line:#2C323A;
  --accent:#FFA53A; --accent-ink:#FFB862; --accent-soft:rgba(255,165,58,.15);
  --hi:rgba(255,255,255,.07); --glow:rgba(130,150,255,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -12px rgba(0,0,0,.65);
  --map-bg:#0F1114; --map-turf:#1A271F; --map-road:#3A414B; --map-text:#98A1AB; --map-water:#1F4A66; --map-bld:#3A4049; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:fixed;inset:0;background:var(--bg);color:var(--ink);transition:background .6s}

#canvas-container{position:absolute;inset:0;z-index:0;cursor:grab;touch-action:none;transition:filter .5s}
#canvas-container:active{cursor:grabbing}
#canvas-container canvas{display:block}
#canvas-container.swap{animation:veil .7s ease}
@keyframes veil{0%{filter:blur(10px) saturate(.6);opacity:.35}100%{filter:none;opacity:1}}
.app.wip-on #canvas-container{filter:blur(14px) saturate(.55);pointer-events:none}
#labels-layer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.app.wip-on #labels-layer{display:none}

/* ---------- glass ---------- */
.glass{background:color-mix(in srgb,var(--panel) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid color-mix(in srgb,var(--line) 85%,transparent);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);border-radius:16px}
.eyebrow{white-space:nowrap;font:600 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell grid ---------- */
.ui{position:absolute;inset:0;z-index:2;pointer-events:none;display:grid;gap:12px;
  grid-template-columns:320px minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head . tools" "side . insp" "side cams mini";
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ui>*{pointer-events:auto;min-width:0}

/* ---------- brand + school picker ---------- */
.bar{grid-area:head;display:flex;align-items:center;gap:12px;padding:8px;position:relative;z-index:5}
.mark{flex:none;width:40px;height:40px;border-radius:11px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:27px;height:27px}
.mark .cap-board{fill:var(--accent)}
.mark .cap-grid{stroke:var(--ink);opacity:.55}
.mark .cap-band{stroke:var(--bg)}
.mark .cap-tassel{stroke:var(--accent)}
.mark .cap-end{fill:var(--accent)}
.brand-t{min-width:0;flex:1}
.brand-t h1{margin:0;font:800 14px/1.25 var(--f-body);letter-spacing:.01em;white-space:nowrap;color:var(--muted)}
.school-btn{display:flex;align-items:center;gap:6px;max-width:100%;margin-top:1px}
.school-btn b{font:900 17px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.school-btn svg{flex:none;width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.school-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.picker{background:color-mix(in srgb,var(--panel) 97%,transparent)!important;position:absolute;z-index:40;left:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));padding:8px;max-height:min(70vh,560px);overflow:auto;transform-origin:top left;animation:pop .28s var(--spring)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.pk-group{padding:8px 8px 4px}
.pk-item{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:10px;padding:8px;cursor:pointer;text-align:left;transition:background .2s,border-color .2s}
.pk-item:hover{background:color-mix(in srgb,var(--raise) 80%,transparent)}
.pk-item.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.pk-item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.pk-item .t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item .t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-item.is-wip .t{filter:blur(.5px);opacity:.62}
.tag{flex:none;font:600 10.5px var(--f-mono);letter-spacing:.04em;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.ok{color:var(--accent-ink);background:var(--accent-soft)}
.tag.soon{color:var(--muted);background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* ---------- top-right tools ---------- */
.tools{grid-area:tools;justify-self:end;align-self:start;display:flex;align-items:center;gap:8px;padding:8px}
.seg{position:relative;display:flex;padding:3px;border-radius:11px;background:color-mix(in srgb,var(--ink) 7%,transparent);flex:none}
.seg button{position:relative;z-index:1;border:0;background:none;padding:6px 11px;border-radius:8px;font:600 12.5px var(--f-body);color:var(--muted);cursor:pointer;transition:color .25s;white-space:nowrap}
.seg button[aria-checked="true"]{color:var(--ink)}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:3px;width:0;border-radius:8px;background:var(--raise);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent);transition:left .7s var(--spring),width .7s var(--spring)}
.tod-knob{--ba:-250deg;position:relative;flex:none;width:36px;height:34px;border-radius:10px;border:0;padding:0;cursor:pointer;background:var(--raise);display:grid;place-items:center;box-shadow:0 0 14px 1px var(--glow),inset 0 1px 0 var(--hi);transition:box-shadow .6s,--ba 1.2s cubic-bezier(.45,0,.2,1)}
.tod-knob::before{content:"";position:absolute;inset:-1px;border-radius:11px;padding:1.5px;pointer-events:none;background:conic-gradient(from var(--ba),transparent 0 55%,var(--accent) 82%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.app[data-scene="night"] .tod-knob::before{background:conic-gradient(from var(--ba),transparent 0 55%,#C9D3FF 82%,transparent)}
.tod-knob canvas{width:22px;height:22px;display:block}
.icon-btn{position:relative;flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--raise) 55%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--muted);transition:background .2s,color .2s,border-color .2s,transform .3s var(--spring)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.icon-btn .tip{position:absolute;top:calc(100% + 8px);right:0;white-space:nowrap;font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--ink);color:var(--bg);opacity:0;transform:translateY(-4px);transition:.2s;pointer-events:none;z-index:5}
.icon-btn:hover .tip{opacity:1;transform:none}
.drawer-btn{display:none}

/* ---------- left directory ---------- */
.side{grid-area:side;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.facts{margin:0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.facts span{white-space:nowrap}
.facts b{font:700 12px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.search{position:relative;display:block}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:14px;height:14px;fill:none;stroke:var(--muted);stroke-width:2}
.search input{width:100%;font:13px var(--f-body);padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--raise) 70%,transparent);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.zones{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.zones::-webkit-scrollbar{display:none}
.zone-btn{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font:500 12px var(--f-body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.zone-btn:hover{color:var(--ink)}
.zone-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.list{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 10px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.bld{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.bld:hover{background:color-mix(in srgb,var(--raise) 75%,transparent);transform:translateX(2px)}
.bld.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.code-chip{flex:none;min-width:40px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font:600 10.5px var(--f-mono);padding:3px 6px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.bld.on .code-chip{background:var(--accent);color:#1a1205}
.bld-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bld-t b{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bld-t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:24px 12px;text-align:center;font-size:12.5px;color:var(--muted)}
.wip-side{padding:14px 16px 16px;color:var(--muted);font-size:12.5px}
.app.wip-on .side{align-self:start}

/* ---------- building card ---------- */
.insp{grid-area:insp;align-self:start;max-height:100%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.insp-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.insp-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.insp-kicker .code-chip{background:var(--accent);color:#1a1205;max-width:none}
.insp-cat{font-size:11.5px;color:var(--accent-ink);font-weight:600}
.insp h3{margin:6px 0 0;font:900 19px/1.3 var(--f-body)}
.insp p{margin:0;font-size:13px;line-height:1.75;color:var(--ink)}
.insp .where{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.insp .where svg{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.insp-actions{display:flex;gap:8px}
.focus-btn{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--raise);font:600 12.5px var(--f-body);cursor:pointer;transition:transform .3s var(--spring),border-color .2s}
.focus-btn:hover{border-color:var(--accent)}
.focus-btn:active{transform:scale(.94)}
.focus-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.x-btn{flex:none;width:26px;height:26px;border-radius:8px;border:0;background:color-mix(in srgb,var(--ink) 7%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.x-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.2;fill:none}
.insp.swap .sw{animation:swapIn .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes swapIn{from{opacity:0;transform:translateY(8px);filter:blur(5px)}}

/* ---------- plan map ---------- */
.mini{grid-area:mini;align-self:end;justify-self:end;width:282px;padding:10px}
.mini-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mini-head b{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;min-width:0}
.mini-head b i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#minimap-canvas{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);cursor:crosshair}

/* ---------- camera rail ---------- */
.cams{grid-area:cams;justify-self:center;align-self:end;display:flex;align-items:center;gap:6px;padding:6px;max-width:100%;min-width:0}
.cam-list{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.cam-list::-webkit-scrollbar{display:none}
.cam-btn{flex:none;border:0;background:none;padding:7px 12px;border-radius:9px;font:500 12.5px var(--f-body);color:var(--muted);cursor:pointer;transition:background .2s,color .2s}
.cam-btn:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.cam-btn.on{background:var(--ink);color:var(--bg);font-weight:700}
.rail-sep{flex:none;width:1px;height:22px;background:var(--line);margin:0 2px}
.drone{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font:700 12px var(--f-body);cursor:pointer;transition:transform .3s var(--spring),background .2s,color .2s;white-space:nowrap}
.drone:active{transform:scale(.95)}
.drone svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.drone::before{content:"";position:absolute;inset:-1px;border-radius:11px;padding:1.5px;pointer-events:none;opacity:0;transition:opacity .3s;background:conic-gradient(from var(--a),transparent 0 62%,var(--accent) 90%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.drone.on{color:var(--accent-ink);background:var(--accent-soft)}
.drone.on::before{opacity:1;animation:spin 2.4s linear infinite}
.drone.on svg{animation:orbit 3s linear infinite}
@keyframes spin{to{--a:360deg}}
@keyframes orbit{to{transform:rotate(360deg)}}
.compass{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;cursor:pointer;padding:0}
.compass svg{width:24px;height:24px;transition:transform .1s linear}
.compass .n{fill:var(--accent)}
.compass .s{fill:color-mix(in srgb,var(--ink) 25%,transparent)}

/* ---------- 3D pins & road tags ---------- */
.label-3d{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transition:opacity .2s;z-index:10;white-space:nowrap;will-change:transform}
.label-3d .pin{transform:translate(-50%,-100%);transition:transform .3s var(--spring)}
.label-3d:hover{z-index:30}
.label-3d:hover .pin{transform:translate(-50%,-108%) scale(1.08)}
.label-3d.active-pin{z-index:35}
.label-3d.active-pin .pin{transform:translate(-50%,-112%) scale(1.12)}
.pin-body{display:flex;align-items:center;gap:6px;padding:3px 8px 3px 4px;border-radius:8px;background:color-mix(in srgb,var(--panel) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--line) 90%,transparent);box-shadow:0 4px 12px -4px rgba(0,0,0,.3)}
.pin-code{font:600 9.5px var(--f-mono);padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.pin-name{font:700 11px var(--f-body);color:var(--ink)}
.label-stem{width:2px;height:9px;margin:0 auto;background:linear-gradient(var(--ink),transparent);opacity:.55}
.active-pin .pin-body{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 0 22px var(--glow)}
.active-pin .pin-code{background:var(--accent);color:#1a1205}
.active-pin .label-stem{background:linear-gradient(var(--accent),transparent);opacity:1}
.road-label-3d{position:absolute;left:0;top:0;pointer-events:none;z-index:6;white-space:nowrap;font:600 10.5px var(--f-body);padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);color:var(--muted);will-change:transform}

/* ---------- tooltip & hint ---------- */

/* ---------- under construction overlay ---------- */
.wip-overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;pointer-events:none;padding:16px}
.wip-card{pointer-events:auto;width:min(420px,100%);padding:26px 26px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .45s var(--spring)}

.wip-actions button{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 14px;font:700 13px var(--f-body);cursor:pointer;transition:border-color .2s,transform .3s var(--spring)}
.wip-actions button:hover{border-color:var(--accent)}
.wip-actions button:active{transform:scale(.95)}
.app.wip-on .insp,.app.wip-on .mini,.app.wip-on .cams,.app.wip-on .hint{display:none!important}

/* ---------- responsive ---------- */
@media (max-width:1180px){.ui{grid-template-columns:290px minmax(0,1fr) 300px}}

/* home map tokens follow the same day / night switch as the shell */
.app{--map-land:#D5DAE0;--map-edge:#F4F5F7;--c-tech:#D97100;--c-gen:#2F6BC8}
.app[data-scene="night"]{--map-land:#262B33;--map-edge:#14171B;--c-tech:#FFA53A;--c-gen:#7FA9FF}
/* ================= HOME: splash -> Taiwan map -> county -> school ================= */
.home{position:absolute;inset:0;z-index:20;background:var(--bg);overflow:hidden;transition:opacity .6s ease,visibility .6s}
.home.gone{opacity:0;visibility:hidden;pointer-events:none}
.home::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(1200px 700px at 72% 38%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 70%),
             radial-gradient(900px 600px at 10% 90%,color-mix(in srgb,var(--ink) 5%,transparent),transparent 70%)}

/* splash */
.splash{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:var(--bg);transition:opacity .9s ease .1s,visibility .9s}
.splash.out{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.splash .mark{width:96px;height:96px;border-radius:26px;animation:splashMark 1s var(--spring) both}
.splash .mark svg{width:64px;height:64px}
.splash h1{margin:0;font:900 clamp(26px,4.4vw,40px)/1.2 var(--f-body);letter-spacing:.06em;animation:splashText .9s cubic-bezier(.22,1,.36,1) .25s both}
.splash p{margin:0;font:600 12px var(--f-mono);letter-spacing:.32em;color:var(--muted);text-transform:uppercase;animation:splashText .9s cubic-bezier(.22,1,.36,1) .4s both}
.splash .cap-tassel{stroke-dasharray:14;stroke-dashoffset:14;animation:tassel .8s ease .5s forwards}
@keyframes splashMark{from{opacity:0;transform:translateY(16px) scale(.8) rotate(-8deg)}}
@keyframes splashText{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
@keyframes tassel{to{stroke-dashoffset:0}}

/* layout */
.home-ui{position:absolute;inset:0;display:grid;gap:12px;pointer-events:none;
  grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hbar hbar" "hside ." "hside hlegend";
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.home-ui>*{pointer-events:auto;min-width:0}
.hbar{grid-area:hbar;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;flex-wrap:wrap}
.hbar .brand-t{flex:1 1 220px}
.hbar h1{margin:0;font:900 17px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-height:18px;white-space:nowrap}
.crumb button{border:0;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.crumb button:hover{color:var(--accent-ink)}
.crumb b{color:var(--ink)}
.hctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;padding:6px 8px;border-radius:9px}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.back-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 12px 7px 9px;font:700 13px var(--f-body);cursor:pointer;transition:border-color .2s,transform .3s var(--spring)}
.back-btn:hover{border-color:var(--accent)}
.back-btn:active{transform:scale(.95)}
.back-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* side list */
.hside{grid-area:hside;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.hside-top{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hside-top h2{margin:0;font:900 20px/1.3 var(--f-body)}
.hside-top .sub{margin:0;font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:8px;background:color-mix(in srgb,var(--ink) 6%,transparent);font-size:11.5px;color:var(--muted)}
.stat b{font:800 15px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.hlist{flex:1;min-height:0;overflow-y:auto;padding:6px 8px 12px;scrollbar-width:thin}
.hgroup{padding:10px 8px 4px}
.crow{display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;background:none;border-radius:10px;padding:8px;cursor:pointer;text-align:left;transition:background .2s,border-color .2s,transform .25s cubic-bezier(.22,1,.36,1)}
.crow:hover,.crow.hot{background:color-mix(in srgb,var(--raise) 80%,transparent);transform:translateX(2px)}
.crow .sw{flex:none;width:12px;height:12px;border-radius:4px;background:var(--c,var(--accent))}
.crow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .t b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .t small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .n{flex:none;font:700 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.srow .dot{flex:none;width:11px;height:11px;border-radius:50%;border:2px solid var(--sc);background:var(--sc)}
.srow.is-gone .dot{background:transparent}
.srow.is-gone .t b{color:var(--muted)}
.tag.closed{color:var(--muted);background:color-mix(in srgb,var(--ink) 8%,transparent);text-decoration:line-through}
.tag.merged,.tag.stopping{color:var(--muted);background:color-mix(in srgb,var(--ink) 8%,transparent)}

/* legend */
.hlegend{grid-area:hlegend;justify-self:end;align-self:end;display:flex;align-items:center;gap:14px;padding:8px 14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:50%;background:var(--sc);border:2px solid var(--sc)}
.lg i.hollow{background:transparent}
.lg i.star{border-radius:3px;transform:rotate(45deg);width:9px;height:9px}

/* the map */
.hmap{position:absolute;inset:0;z-index:0}
.hmap svg{width:100%;height:100%;display:block;touch-action:manipulation}
.county{fill:var(--map-land);stroke:var(--map-edge);stroke-width:.9;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s,opacity .5s,filter .35s}
.county.dim{opacity:.18;pointer-events:none}
.county.sel{fill:color-mix(in srgb,var(--cc) 30%,var(--map-land))}
#lift path{pointer-events:none;opacity:0;transform-box:fill-box;transform-origin:50% 60%;transition:transform .45s var(--spring),opacity .35s;fill:var(--cc);stroke:color-mix(in srgb,var(--cc) 60%,#000);stroke-width:1.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 10px 10px rgba(10,14,20,.28))}
#lift path.up{opacity:1;transform:translateY(-1.4%) scale(1.06)}
.inset-box{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;transition:opacity .4s}
.inset-lbl{font:600 11px var(--f-body);fill:var(--muted);transition:opacity .4s}
.clbl{font:800 12px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .25s}
.clbl.on{opacity:1}
.sdot{cursor:pointer;transition:opacity .4s}
.sdot circle,.sdot rect{fill:var(--sc);stroke:var(--bg);stroke-width:1.4;vector-effect:non-scaling-stroke;transition:r .25s}
.sdot.gone circle{fill:var(--bg);stroke:var(--sc);stroke-width:1.6}
.sdot.ready rect{stroke:var(--ink);stroke-width:1.2}
.sdot.hide{opacity:0;pointer-events:none}
.sdot text{font:700 10px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .25s}
.sdot.lbl text,.sdot.hot text{opacity:1}
.sdot.hot circle{r:var(--rh)}
.map-hint{position:absolute;left:50%;bottom:18px;translate:-50% 0;z-index:1;padding:7px 14px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .5s}
.map-hint.gone{opacity:0}

/* the 3D view's back button */
.home-back{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--raise);cursor:pointer;transition:border-color .2s,transform .3s var(--spring)}
.home-back:hover{border-color:var(--accent)}
.home-back:active{transform:scale(.92)}
.home-back svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

@media (max-width:900px){
  .home-ui{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hbar" "." "hside";gap:10px}
  .hside{max-height:42vh}
  .hlegend{display:none}
  .hbar h1{font-size:15px}
  .map-hint{bottom:calc(42vh + 24px)}
}

/* =====================================================================
   LIQUID GLASS — one material for every surface.
   Panels = thick frosted glass (legible text). Controls = thin clear glass.
   Selected item in a group = a bright "lens". Toggled on = amber-tinted glass.
   The rim / specular light is all inset box-shadow, so it costs no extra layers.
   ===================================================================== */
.app{
  --g-panel:rgba(250,251,253,.50); --g-fill:rgba(255,255,255,.30); --g-fill-h:rgba(255,255,255,.62);
  --g-sheen:rgba(255,255,255,.62); --g-rim:rgba(255,255,255,.58); --g-hi:rgba(255,255,255,.96); --g-lo:rgba(255,255,255,.28);
  --g-edge:rgba(22,32,48,.10); --g-well:rgba(22,32,48,.06);
  --g-shadow:0 1px 1px rgba(16,24,40,.05),0 14px 34px -14px rgba(16,24,40,.34);
  --g-btn-shadow:0 1px 1px rgba(16,24,40,.05),0 5px 14px -7px rgba(16,24,40,.32);
  --lens:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.66));
  --lens-shadow:inset 0 0 0 1px rgba(255,255,255,.95),inset 0 -1.5px 1px rgba(255,255,255,.5),0 0 0 .5px rgba(22,32,48,.10),0 6px 16px -6px rgba(16,24,40,.34);
  --g-tint:color-mix(in srgb,var(--accent) 24%,rgba(255,255,255,.42));
  --line:rgba(22,32,48,.10);
  --ambient-a:rgba(255,168,64,.30); --ambient-b:rgba(86,140,235,.22); --ambient-c:rgba(70,200,180,.14);
}
.app[data-scene="sunset"]{--g-panel:rgba(255,246,238,.50); --g-fill:rgba(255,242,230,.32); --ambient-a:rgba(255,120,60,.32); --ambient-b:rgba(200,110,190,.20)}
.app[data-scene="night"]{
  --g-panel:rgba(26,30,38,.56); --g-fill:rgba(70,78,92,.26); --g-fill-h:rgba(110,120,140,.36);
  --g-sheen:rgba(255,255,255,.13); --g-rim:rgba(255,255,255,.15); --g-hi:rgba(255,255,255,.30); --g-lo:rgba(255,255,255,.05);
  --g-edge:rgba(0,0,0,.45); --g-well:rgba(0,0,0,.24);
  --g-shadow:0 1px 1px rgba(0,0,0,.3),0 18px 42px -14px rgba(0,0,0,.75);
  --g-btn-shadow:0 1px 1px rgba(0,0,0,.3),0 6px 16px -8px rgba(0,0,0,.7);
  --lens:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.09));
  --lens-shadow:inset 0 0 0 1px rgba(255,255,255,.24),inset 0 1px 0 rgba(255,255,255,.34),0 0 0 .5px rgba(0,0,0,.5),0 6px 16px -6px rgba(0,0,0,.7);
  --g-tint:color-mix(in srgb,var(--accent) 30%,rgba(255,255,255,.05));
  --line:rgba(255,255,255,.09);
  --ambient-a:rgba(255,150,60,.16); --ambient-b:rgba(90,120,255,.20); --ambient-c:rgba(60,190,200,.08);
}

/* ---------- panels ---------- */
.glass{
  background:linear-gradient(162deg,var(--g-sheen),transparent 32%),var(--g-panel);
  -webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);
  border:0;border-radius:24px;
  box-shadow:inset 0 0 0 1px var(--g-rim),inset 0 1px 0 var(--g-hi),inset 0 -1px 0 var(--g-lo),inset 0 0 24px -10px var(--g-sheen),0 0 0 .5px var(--g-edge),var(--g-shadow);
}
.hint.glass,.map-hint.glass,.hlegend.glass{border-radius:999px}
.tooltip.glass{border-radius:16px}
.wip-card.glass{border-radius:30px}
.bar,.hbar,.tools{border-radius:22px}

/* ---------- controls: clear glass ---------- */
.icon-btn,.home-back,.back-btn,.focus-btn,.wip-actions button,.drone,.compass,.x-btn,.tod-knob,.zone-btn,.chk{
  border:0;color:var(--ink);
  background:radial-gradient(90% 90% at var(--gx,35%) var(--gy,0%),var(--g-sheen),transparent 62%),var(--g-fill);
  box-shadow:inset 0 0 0 1px var(--g-rim),inset 0 1px 0 var(--g-hi),inset 0 -1px 1px var(--g-lo),0 0 0 .5px var(--g-edge),var(--g-btn-shadow);
  transition:background-color .25s,color .2s,box-shadow .25s,transform .45s var(--spring);
}
.icon-btn:hover,.home-back:hover,.back-btn:hover,.focus-btn:hover,.wip-actions button:hover,.drone:hover,.compass:hover,.x-btn:hover,.tod-knob:hover,.zone-btn:hover,.chk:hover{
  background:radial-gradient(90% 90% at var(--gx,35%) var(--gy,0%),var(--g-hi),transparent 66%),var(--g-fill-h);border-color:transparent}
.icon-btn:active,.home-back:active,.back-btn:active,.focus-btn:active,.wip-actions button:active,.drone:active,.compass:active,.x-btn:active,.tod-knob:active,.zone-btn:active,.chk:active{transform:scale(.92)}
.icon-btn,.home-back,.x-btn,.compass,.tod-knob{border-radius:50%}
.icon-btn{color:var(--ink)}
.icon-btn svg{stroke-width:1.9}
.home-back{width:40px;height:40px}
.back-btn,.focus-btn,.wip-actions button,.drone,.zone-btn,.chk{border-radius:999px}
.x-btn{width:28px;height:28px}
.chk{padding:7px 12px 7px 10px;color:var(--ink);font-weight:600}

/* toggled on = amber-tinted glass */
.icon-btn[aria-pressed="true"],.drone.on{color:var(--accent-ink);
  background:radial-gradient(90% 90% at var(--gx,35%) var(--gy,0%),var(--g-sheen),transparent 62%),var(--g-tint);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 38%,var(--g-rim)),inset 0 1px 0 var(--g-hi),inset 0 -1px 1px var(--g-lo),0 0 0 .5px var(--g-edge),0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.drone::before,.drone.on::before{display:none}

/* selected in a group = lens */
.seg{border-radius:999px;background:var(--g-well);box-shadow:inset 0 1px 2px rgba(0,0,0,.07),inset 0 0 0 1px color-mix(in srgb,var(--g-rim) 40%,transparent)}
.seg button{border-radius:999px}
.seg-thumb{border-radius:999px;background:var(--lens);box-shadow:var(--lens-shadow)}
.zone-btn.on,.cam-btn.on{background:var(--lens);box-shadow:var(--lens-shadow);color:var(--ink);font-weight:700}
.cam-btn{border-radius:999px;transition:background .25s,color .2s,box-shadow .25s,transform .45s var(--spring)}
.cam-btn:hover{background:var(--g-fill);box-shadow:inset 0 0 0 1px var(--g-rim)}
.cam-btn:active{transform:scale(.94)}
.rail-sep{background:var(--line)}
.cams{border-radius:999px;padding:6px 7px}

/* search = recessed glass well */
.search input{border:0;border-radius:999px;background:var(--g-well);box-shadow:inset 0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px color-mix(in srgb,var(--g-rim) 45%,transparent)}
.search input:focus{box-shadow:inset 0 1px 2px rgba(0,0,0,.08),0 0 0 3px var(--accent-soft),inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent)}

/* list rows */
.bld,.crow,.pk-item{border:0;border-radius:14px;transition:background .25s,box-shadow .25s,transform .35s cubic-bezier(.22,1,.36,1)}
.bld:hover,.crow:hover,.crow.hot,.pk-item:hover{transform:none;background:var(--g-fill);box-shadow:inset 0 0 0 1px var(--g-rim),inset 0 1px 0 var(--g-hi)}
.bld.on{background:var(--g-tint);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,var(--g-rim)),inset 0 1px 0 var(--g-hi)}
.code-chip,.pin-code{border-radius:7px}
.stat{border-radius:999px;background:var(--g-well);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g-rim) 40%,transparent)}
.tag{border-radius:999px}

/* minimap, pins, road tags */
#minimap-canvas{border:0;border-radius:16px;box-shadow:inset 0 0 0 1px var(--g-rim),0 0 0 .5px var(--g-edge)}
.mini.glass{border-radius:24px}
.pin-body{border:0;border-radius:999px;padding:3px 9px 3px 4px;background:linear-gradient(160deg,var(--g-sheen),transparent 45%),var(--g-panel);
  box-shadow:inset 0 0 0 1px var(--g-rim),inset 0 1px 0 var(--g-hi),0 0 0 .5px var(--g-edge),0 6px 14px -6px rgba(0,0,0,.35)}
.pin-code{border-radius:999px}
.active-pin .pin-body{box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 1px 0 var(--g-hi),0 0 0 4px var(--accent-soft),0 0 22px var(--glow)}
.road-label-3d{border:0;background:linear-gradient(160deg,var(--g-sheen),transparent 50%),var(--g-panel);box-shadow:inset 0 0 0 1px var(--g-rim),0 0 0 .5px var(--g-edge)}
.road-label-3d[data-tone="arterial"]{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,var(--g-rim)),0 0 0 .5px var(--g-edge)}
.road-label-3d[data-tone="gate"]{border:1px dashed var(--g-rim)}
.stripe{border-radius:999px}

/* ---------- logo: amber glass tile with a frosted-white cap ---------- */
.mark{position:relative;overflow:hidden;border-radius:30%;
  background:linear-gradient(150deg,#FFC163 0%,#F08A12 52%,#C85E00 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),inset 0 1.5px 0 rgba(255,255,255,.85),inset 0 -2px 4px rgba(120,50,0,.35),inset 0 0 12px rgba(255,236,200,.35),0 0 0 .5px rgba(120,60,0,.25),0 6px 16px -6px rgba(200,94,0,.55)}
.mark::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 75% at 28% -8%,rgba(255,255,255,.75),rgba(255,255,255,0) 58%),radial-gradient(80% 50% at 80% 112%,rgba(255,220,170,.5),transparent 70%)}
.mark svg{position:relative;filter:drop-shadow(0 1px 1.2px rgba(120,50,0,.45))}
.mark .cap-board{fill:url(#lg-board);stroke:rgba(255,255,255,.95);stroke-width:.45;stroke-linejoin:round}
.mark .cap-skull{fill:url(#lg-skull);stroke:rgba(255,255,255,.85);stroke-width:.45;stroke-linejoin:round}
.mark .cap-shine{stroke:#fff;stroke-width:.7;stroke-linecap:round;fill:none;opacity:.95}
.mark .cap-tassel{stroke:rgba(255,255,255,.95);fill:none}
.mark .cap-end{fill:rgba(255,255,255,.95)}
.mark .cap-grid,.mark .cap-band{display:none}
.splash .mark{border-radius:30%}
.splash .mark::after{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.65) 50%,transparent 60%);transform:translateX(-70%);animation:glint 1.4s cubic-bezier(.4,0,.2,1) .55s forwards}
@keyframes glint{to{transform:translateX(70%)}}

/* ---------- time-of-day knob: plain glass, glass glyphs, no running border ---------- */
.tod-knob{width:38px;height:38px;--ba:0deg}
.tod-knob::before{display:none!important}
.tod-ico{width:26px;height:26px;display:block;overflow:visible}
.tod-ico .tg{opacity:0;transform-origin:12px 12px;transform:scale(.35) rotate(-110deg);filter:blur(1.6px);
  transition:opacity .4s ease,transform .75s var(--spring),filter .45s ease}
.tod-ico .tg.on{opacity:1;transform:none;filter:none}
.tod-ico .orb{stroke:rgba(255,255,255,.9);stroke-width:.55}
.tod-ico .ray{stroke-linecap:round;stroke-width:1.9;fill:none}
.tod-ico .spec{fill:#fff}
.tod-ico .rim{fill:none;stroke:rgba(255,255,255,.55);stroke-width:.5}
.tod-ico .g-day{filter:drop-shadow(0 1px 2px rgba(224,123,0,.55))}
.tod-ico .g-sunset{filter:drop-shadow(0 1px 2px rgba(214,70,40,.5))}
.tod-ico .g-night{filter:drop-shadow(0 1px 2.5px rgba(120,140,255,.6))}

/* ---------- home ---------- */
.home{background:
  radial-gradient(800px 560px at 12% 18%,var(--ambient-a),transparent 62%),
  radial-gradient(900px 640px at 92% 88%,var(--ambient-b),transparent 64%),
  radial-gradient(700px 520px at 60% 8%,var(--ambient-c),transparent 60%),var(--bg)}
.home::before{display:none}
.splash{background:
  radial-gradient(700px 500px at 30% 30%,var(--ambient-a),transparent 62%),
  radial-gradient(800px 560px at 75% 75%,var(--ambient-b),transparent 64%),var(--bg)}
.hside{border-radius:24px}
.county{stroke:rgba(255,255,255,.85)}
.app[data-scene="night"] .county{stroke:rgba(255,255,255,.14)}
#lift path{stroke:rgba(255,255,255,.95);stroke-width:1.4}
.hmap svg .dots,.hmap svg .clbls{transition:opacity .45s ease}
.hmap svg.moving .dots,.hmap svg.moving .clbls{opacity:0;visibility:hidden;transition:none}
.sdot circle,.sdot rect{stroke:rgba(255,255,255,.95)}
.app[data-scene="night"] .sdot circle,.app[data-scene="night"] .sdot rect{stroke:rgba(10,12,16,.9)}

/* magnet: transforms are set from JS via the `translate` property */
.mag-on{will-change:translate}
</style>
</head>

        <h1>大專院校 3D 校園地圖</h1>
        <p>Taiwan Campus 3D</p>
      </div>
    </div>
  </section>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="lg-board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".74"/></linearGradient>
    <linearGradient id="lg-skull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".86"/></linearGradient>

    <linearGradient id="tg-dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3AE"/><stop offset=".55" stop-color="#FF8A4C"/><stop offset="1" stop-color="#E0475A"/></linearGradient>
    <radialGradient id="tg-moon" cx=".5" cy=".5" r=".6" fx=".3" fy=".32"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#DCE3FF"/><stop offset="1" stop-color="#94A3F2"/></radialGradient>

  </defs></svg>

.7Q18.3 5.6 16.2 5.3Q18.3 5 18.6 2.9Z" fill="url(#tg-moon)" stroke="rgba(255,255,255,.85)" stroke-width=".35"/></g></svg></button>

  Object.keys(facadeCache).forEach((k) => { facadeCache[k].dispose(); delete facadeCache[k]; });
  interactiveMeshes = []; BLD = {}; labelElements = []; roadLabelElements = [];
  animatedJets = []; animatedVehicles = []; animatedSpin = [];
  labelsLayer.innerHTML = '';
}

function buildGroundAndLand(c) {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), lambert(PAL.ground));

  campusGroup.add(ground);
  allOutlines(c).forEach((o) => campusGroup.add(flatMesh(o, 0.04, lambert(PAL.turf))));
  const mutedTurf = new THREE.Color(PAL.turf).lerp(new THREE.Color(PAL.ground), 0.7).getHex();
  (c.mutedOutlines || []).forEach((o) => campusGroup.add(flatMesh(o, 0.04, lambert(mutedTurf))));
  const byKind = {};
  (c.greens || []).forEach((gr) => { (byKind[gr.k] = byKind[gr.k] || []).push(flatGeo(gr.poly, 0.1)); });
  Object.keys(byKind).forEach((k) => {
    const col = { lawn: PAL.lawn, park: PAL.park, pasture: PAL.pasture, field: PAL.field }[k] || PAL.lawn;
    const m = new THREE.Mesh(mergeGeos(byKind[k]), lambert(col)); m.receiveShadow = true; campusGroup.add(m);
  });
  (c.pitches || []).forEach((p) => {
    const [, , w, d] = p.rect;

    campusGroup.add(texturedRect(p.rect, tex, 0.19));
  });
  (c.paved || []).forEach((p) => campusGroup.add(flatMesh(p.poly, 0.12, lambert(PAL.paved))));
}

const waterByB = {};
function buildRoadsAndWater(c) {
  const Y_OF = { arterial: 0.16, road: 0.18, path: 0.2, ped: 0.22, elevated: 5.2 };
  const COL_OF = { arterial: PAL.arterial, road: PAL.road, path: PAL.path, ped: PAL.ped, elevated: PAL.arterial };
  const bucket = {}, medians = [], pillars = [];
  (c.roads || []).forEach((r) => {
    const y = Y_OF[r.k];
    if (r.b) {
      const m = new THREE.Mesh(ribbonGeo(r.pts, r.w), lambert(COL_OF[r.k])); m.position.y = y; m.receiveShadow = true; campusGroup.add(m);
      (waterByB[r.b] = waterByB[r.b] || []).push({ mesh: m, poly: null, pts: r.pts, w: r.w });
    } else {
      const g = ribbonGeo(r.pts, r.w); g.translate(0, y, 0); (bucket[r.k] = bucket[r.k] || []).push(g);
    }
    if (r.k === 'elevated') {
      const L = polyLength(r.pts);
      for (let d = 4; d < L; d += 14) { const p = pointAlong(r.pts, d); pillars.push([p.x, p.z]); }
      const side = ribbonGeo(r.pts, r.w + 0.6); side.translate(0, y - 0.45, 0); (bucket.elevSide = bucket.elevSide || []).push(side);
    }
    if ((r.k === 'arterial' || r.k === 'elevated') && r.w > 6) {
      const med = ribbonGeo(r.pts, 0.35); med.translate(0, y + 0.03, 0); medians.push(med);
      // traffic
      const L = polyLength(r.pts), cols = [0xe8edf2, 0x2f3a46, 0xc8553d, 0x5d86b0, 0xd9b44a, 0x9aa3ad];
      const rnd = mulberry32(hashStr(r.name || 'road'));
      for (let i = 0; i < (L < 60 ? 0 : Math.max(2, Math.round(L / 45))); i++) {
        const car = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 0.75), lambert(cols[i % cols.length]));
        car.castShadow = true;
        const cab = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.4, 0.65), lambert(PAL.night ? 0xffd27a : 0x2b333d));
        cab.position.set(-0.1, 0.45, 0); car.add(cab);
        car.userData = { pts: r.pts, L, d: rnd() * L, dir: i % 2 ? 1 : -1, lane: (i % 2 ? 1 : -1) * r.w * 0.22, v: 0.09 + rnd() * 0.06 };
        car.userData.y = y + 0.32;
        campusGroup.add(car); animatedVehicles.push(car);
      }
    }
  });
  Object.keys(bucket).forEach((k) => {
    const col = k === 'elevSide' ? 0x9aa1aa : COL_OF[k];
    const m = new THREE.Mesh(mergeGeos(bucket[k]), lambert(col)); m.receiveShadow = true;
    if (k === 'elevated') m.castShadow = true;
    campusGroup.add(m);
  });
  if (medians.length) campusGroup.add(new THREE.Mesh(mergeGeos(medians), lambert(PAL.line)));
  if (pillars.length) {
    const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.8, 0.9, 5, 8), lambert(0xa7adb5), pillars.length);
    const o = new THREE.Object3D();
    pillars.forEach(([x, z], i) => { o.position.set(x, 2.5, z); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
    campusGroup.add(im);
  }
  (c.creeks || []).forEach((cr) => {
    const m = new THREE.Mesh(ribbonGeo(cr.pts, cr.w), new THREE.MeshPhongMaterial({ color: PAL.water, emissive: PAL.waterE, shininess: 90 }));
    m.position.y = 0.14; campusGroup.add(m);
  });
  (c.water || []).forEach((w) => {
    const wc = w.k === 'lotus' ? (PAL.night ? 0x1b3a2a : 0x4f8f6a) : w.k === 'pool' ? (PAL.night ? 0x14506a : 0x5fc3dc) : PAL.water;
    const mat = new THREE.MeshPhongMaterial({ color: wc, emissive: PAL.waterE, shininess: 95, specular: 0x8899aa });
    const m = flatMesh(w.poly, 0.24, mat);
    campusGroup.add(m);
    if (w.b) (waterByB[w.b] = waterByB[w.b] || []).push({ mesh: m, poly: w.poly });
    if (w.k === 'lotus') {
      const bb = polyBBox(w.poly), rnd = mulberry32(7), pads = [];
      for (let i = 0; i < 220 && pads.length < 70; i++) { const x = bb[0] + rnd() * (bb[1] - bb[0]), z = bb[2] + rnd() * (bb[3] - bb[2]); if (pointInPoly(x, z, w.poly)) pads.push([x, z]); }
      const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.42, 0.42, 0.05, 10), lambert(PAL.night ? 0x2c5236 : 0x6fa85a), pads.length);
      const o = new THREE.Object3D();
      pads.forEach(([x, z], i) => { o.position.set(x, 0.3, z); const s = 0.6 + rnd() * 0.7; o.scale.set(s, 1, s); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
      campusGroup.add(im);
    }
  });
}

function buildTrees(c, obstacles) {
  const pts = [];
  const blocked = makeBlockGrid(obstacles, 2);
  buildPalms(c, blocked);
  (c.forests || []).forEach((f, fi) => {
    const bb = polyBBox(f.poly), rnd = mulberry32(1000 + fi);
    let tries = 0, got = 0;
    while (got < f.n && tries < f.n * 30) {
      tries++;
      const x = bb[0] + rnd() * (bb[1] - bb[0]), z = bb[2] + rnd() * (bb[3] - bb[2]);
      if (!pointInPoly(x, z, f.poly) || blocked(x, z)) continue;
      pts.push([x, z, 0.75 + rnd() * 0.55, rnd()]); got++;
    }
  });
  (c.rows || []).forEach((r, ri) => {
    const L = polyLength(r.pts), rnd = mulberry32(5000 + ri);
    for (let d = 0; d <= L; d += r.step) { const p = pointAlong(r.pts, d); if (!blocked(p.x, p.z)) pts.push([p.x, p.z, 0.8 + rnd() * 0.25, rnd()]); }
  });
  if (!pts.length) return;
  const crownGeo = new THREE.IcosahedronGeometry(1.25, 0);
  const trunkGeo = new THREE.CylinderGeometry(0.13, 0.18, 1.3, 5);
  const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), pts.length);
  const trunks = new THREE.InstancedMesh(trunkGeo, lambert(PAL.trunk), pts.length);
  crowns.castShadow = true;
  const o = new THREE.Object3D(), col = new THREE.Color();
  pts.forEach(([x, z, s, k], i) => {
    o.position.set(x, 0.65 * s, z); o.rotation.set(0, k * 6.28, 0); o.scale.set(s, s, s); o.updateMatrix(); trunks.setMatrixAt(i, o.matrix);
    o.position.set(x, 1.9 * s, z); o.scale.set(s * 1.05, s * 0.95, s * 1.05); o.updateMatrix(); crowns.setMatrixAt(i, o.matrix);
    col.setHex(PAL.trees[Math.floor(k * PAL.trees.length) % PAL.trees.length]); crowns.setColorAt(i, col);
  });
  crowns.instanceColor.needsUpdate = true;
  campusGroup.add(trunks, crowns);
}

function buildPalms(c, blocked) {
  const pts = [];
  (c.palms || []).forEach((r, ri) => {
    const L = polyLength(r.pts), rnd = mulberry32(9000 + ri);
    for (let d = 1; d <= L; d += r.step) { const p = pointAlong(r.pts, d); if (!blocked(p.x, p.z)) pts.push([p.x, p.z, 0.9 + rnd() * 0.2, rnd()]); }
  });
  if (!pts.length) return;
  const H = 5.6;
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.16, 0.24, H, 6), lambert(PAL.night ? 0x4a4842 : 0xb9b2a4), pts.length);
  const fronds = [];
  for (let i = 0; i < 8; i++) {
    const f = new THREE.BoxGeometry(2.3, 0.06, 0.38); f.translate(1.15, 0, 0); f.rotateZ(-0.38); f.rotateY(i * Math.PI / 4); fronds.push(f);
  }
  const crownGeo = mergeGeos(fronds);
  const crown = new THREE.InstancedMesh(crownGeo, lambert(PAL.night ? 0x223f28 : 0x4f8a45), pts.length);
  crown.castShadow = true; trunk.castShadow = true;
  const o = new THREE.Object3D();
  pts.forEach(([x, z, s, k], i) => {
    o.rotation.set(0, k * 6.28, 0); o.scale.set(s, s, s);
    o.position.set(x, H * s / 2, z); o.updateMatrix(); trunk.setMatrixAt(i, o.matrix);
    o.position.set(x, H * s, z); o.updateMatrix(); crown.setMatrixAt(i, o.matrix);
  });
  campusGroup.add(trunk, crown);
}

function addPartBuilding(group, part, b, tune, opts) {
  const f = part.f != null ? part.f : b.f;
  if (!f) return null;
  const h = f * FH + 0.5;
  const tang = (b.roof === 'hip' || b.roof === 'gable') && f <= 3;
  const wallMat = wallMaterial(opts && opts.context ? '#ddd8cf' : (b.wall || '#e2ddd4'), tang ? 'tang' : '');
  const flatRoof = roofMaterial(part.rc || (b.roof === 'flat' || !b.roof ? (b.roofc || '#c3c7cc') : '#c3c7cc'));
  let mesh;
  if (part.cyl) {
    const [cx, cz, r] = part.cyl;
    const tex = facadeTex(b.wall || '#e2ddd4').clone(); tex.needsUpdate = true;
    tex.repeat.set((2 * Math.PI * r) / TILE_W, h / (4 * FH)); tex.offset.set(0, 0);
    const side = new THREE.MeshLambertMaterial({ map: tex });
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 28), [side, flatRoof, flatRoof]);
    mesh.position.set(cx, h / 2, cz);
  } else {
    const shape = new THREE.Shape(part.p.map((p) => new THREE.Vector2(p[0], -p[1])));
    const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
    geo.rotateX(-Math.PI / 2);
    mesh = new THREE.Mesh(geo, [flatRoof, wallMat]);
  }
  mesh.castShadow = true; mesh.receiveShadow = true;
  group.add(mesh);
  let roofType = b.roof || 'flat';
  const bigCourt = part.rect && roofType === 'hip' && Math.min(part.rect[2], part.rect[3]) > 16;
  if ((roofType === 'hip' || roofType === 'gable') && (!part.rect || bigCourt) && part.p) {
    const rc = b.roofc || (opts && opts.context ? '#7b7570' : tune.tileRoof);
    const shape = new THREE.Shape(part.p.map((p) => new THREE.Vector2(p[0], -p[1])));
    const bt = Math.min(1.5, 0.5 + f * 0.35), bs = 0.75;
    const g2 = new THREE.ExtrudeGeometry(shape, { depth: 0.15, bevelEnabled: true, bevelThickness: bt, bevelSize: bs, bevelSegments: 1 });
    g2.rotateX(-Math.PI / 2);
    const roof = new THREE.Mesh(g2, roofMaterial(rc));
    roof.position.y = h; roof.castShadow = true;
    group.add(roof);
    return h;
  }
  if (part.rect && roofType !== 'flat') {
    const [cx, cz, w, d, ang] = part.rect;
    const ov = 0.45;
    const hr = roofType === 'vault' ? Math.min(w, d) * 0.22 : roofType === 'pyramid' ? Math.min(w, d) * 0.42 : Math.min(3.2, Math.min(w, d) * 0.3);
    const rc = b.roofc || (opts && opts.context ? '#7b7570' : tune.tileRoof);
    const roof = new THREE.Mesh(roofGeo(roofType, w + ov * 2, d + ov * 2, hr), roofType === 'vault' ? roofMaterial(b.roofc || '#e9ecef') : roofMaterial(rc));
    roof.material.side = THREE.DoubleSide;
    roof.position.set(cx, h, cz); roof.rotation.y = (ang || 0) * Math.PI / 180;
    roof.castShadow = true;
    group.add(roof);
  } else if (b.solar && part.rect) {
    const [cx, cz, w, d, ang] = part.rect;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(w * 0.72, 0.12, d * 0.62), lambert(PAL.solar));
    panel.position.set(cx, h + 0.08, cz); panel.rotation.y = (ang || 0) * Math.PI / 180;
    group.add(panel);
  }
  return h;
}

      });

    case 'site': {

      const sb = polyBBox(partPoly(P)), [cx, cz] = center || [(sb[0] + sb[1]) / 2, (sb[2] + sb[3]) / 2];

// Luce Chapel: two sides, each a lower and an upper twisted shell, leaving light slits between them and along the ridge
function buildLuce(group, rect) {
  const [cx, cz, , , ] = rect;
  const L = 11, W = 7.4, H = 6.6;
  const ang = -0.2;
  const holder = new THREE.Group(); holder.position.set(cx, 0.25, cz); holder.rotation.y = ang;
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.fillStyle = PAL.night ? '#6b5320' : '#e3b54a'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = PAL.night ? 'rgba(0,0,0,.4)' : 'rgba(120,80,20,.45)'; g.lineWidth = 3;
  for (let i = -128; i < 256; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 128, 128); g.stroke(); g.beginPath(); g.moveTo(i + 128, 0); g.lineTo(i, 128); g.stroke(); }
  const tex = new THREE.CanvasTexture(cv); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(3, 2);
  const mat = new THREE.MeshPhongMaterial({ map: tex, side: THREE.DoubleSide, shininess: 60, emissive: PAL.night ? 0x2a1a00 : 0x000000 });
  const shell = (side, v0, v1) => {
    const nu = 18, nv = 10, pos = [], uv = [], idx = [];
    for (let i = 0; i <= nu; i++) {
      const u = i / nu, x = (u - 0.5) * L;
      for (let j = 0; j <= nv; j++) {
        const v = v0 + (v1 - v0) * j / nv;
        const twist = (u - 0.5) * 2 * v * (1 - v) * 1.6 * side;
        const half = (W / 2) * Math.pow(1 - v, 1.08) * (1 + 0.18 * Math.pow(Math.abs(u - 0.5) * 2, 2) * (1 - v));
        pos.push(x, v * H, side * Math.max(0.16, half) + twist);
        uv.push(u, v);
      }
    }
    for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) { const a = i * (nv + 1) + j, b2 = a + nv + 1; idx.push(a, b2, a + 1, a + 1, b2, b2 + 1); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat); m.castShadow = true; return m;
  };
  [-1, 1].forEach((s) => { holder.add(shell(s, 0, 0.56)); holder.add(shell(s, 0.6, 0.975)); });
  // glazed gable ends
  const glass = new THREE.MeshPhongMaterial({ color: PAL.night ? 0xffd88a : 0x30404f, emissive: PAL.night ? 0x6a4a10 : 0x000000, side: THREE.DoubleSide, transparent: true, opacity: 0.88 });
  [-1, 1].forEach((e) => {
    const s = new THREE.Shape(); s.moveTo(-W / 2 * 0.98, 0); s.lineTo(W / 2 * 0.98, 0); s.lineTo(0.15, H * 0.97); s.lineTo(-0.15, H * 0.97); s.closePath();
    const m = new THREE.Mesh(new THREE.ShapeGeometry(s), glass); m.rotation.y = Math.PI / 2; m.position.x = e * L / 2 * 0.985; holder.add(m);
  });
  const podium = new THREE.Mesh(new THREE.BoxGeometry(L + 3, 0.3, W + 3), lambert(0xd9d4cc)); podium.position.y = -0.1; holder.add(podium);
  group.add(holder);
  return H + 0.4;
}

function registerBuilding(b, group, top) {
  let bb = [Infinity, -Infinity, Infinity, -Infinity];
  const grow = (poly) => { const q = polyBBox(poly); bb = [Math.min(bb[0], q[0]), Math.max(bb[1], q[1]), Math.min(bb[2], q[2]), Math.max(bb[3], q[3])]; };
  b.parts.forEach((p) => grow(partPoly(p)));
  (waterByB[b.id] || []).forEach((w) => {
    if (w.poly) grow(w.poly);
    else if (w.pts) grow(w.pts);
    campusGroup.remove(w.mesh); group.add(w.mesh);
  });
  if (!isFinite(bb[0])) return;
  group.userData = { buildingId: b.id };
  group.traverse((o) => { if (o.isMesh) { o.userData.buildingId = b.id; interactiveMeshes.push(o); } });
  campusGroup.add(group);
  const cx = (bb[0] + bb[1]) / 2, cz = (bb[2] + bb[3]) / 2;
  BLD[b.id] = { data: b, group, bbox: bb, cx, cz, top: Math.max(top, 1.5), r: Math.max(4, Math.hypot(bb[1] - bb[0], bb[3] - bb[2]) / 2) };
}

function buildCampus(c) {
  const tune = CAMPUS_TUNING[c.id] || CAMPUS_TUNING.wip;
  Object.keys(waterByB).forEach((k) => delete waterByB[k]);
  buildGroundAndLand(c);
  buildRoadsAndWater(c);
  const obstacles = [], muted = [];
  const isMuted = (s) => c.active && s && s !== c.active;
  (c.buildings || []).forEach((b) => {
    if (isMuted(b.school)) {
      // another school sharing this map: keep it on screen, dimmed and not interactive
      b.parts.forEach((part) => { obstacles.push(polyBBox(partPoly(part))); if (part.f !== 0 && part.p) muted.push(part); });
      if (b.kind) { const g = new THREE.Group(); buildSpecial(b, g, c); campusGroup.add(g); }
      return;
    }
    const group = new THREE.Group();
    let top = 0;
    b.parts.forEach((part) => { const h = addPartBuilding(group, part, b, tune); if (h) top = Math.max(top, h + (b.roof && b.roof !== 'flat' ? 2 : 0)); obstacles.push(polyBBox(partPoly(part))); });
    if (b.kind) top = Math.max(top, buildSpecial(b, group, c) || 0);
    if (['luce', 'pavilion', 'belltower', 'fubell', 'temple', 'lakepav'].includes(b.kind)) obstacles.push(polyBBox(partPoly(b.parts[0])).map((v, i) => v + (i % 2 ? 4 : -4)));
    registerBuilding(b, group, top);
  });
  [['context', '#ddd8cf'], ['city', '#cfcac3']].forEach(([key, wall]) => {
    const prisms = [];
    (c[key] || []).forEach((part) => {
      obstacles.push(polyBBox(part.p));
      if (isMuted(part.s)) { muted.push(part); return; }
      if (part.rect) {   // pitched-roof context buildings keep their own roof mesh
        const g = new THREE.Group();
        addPartBuilding(g, part, { f: part.f, roof: 'hip', wall }, tune, { context: true });
        campusGroup.add(g); return;
      }
      const h = (part.f || 2) * FH + 0.5;
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(part.p.map((p) => new THREE.Vector2(p[0], -p[1]))), { depth: h, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2); prisms.push(geo);
    });
    if (prisms.length) {
      const m = new THREE.Mesh(mergeGeos(prisms, true), [roofMaterial('#c3c7cc'), wallMaterial(wall)]);
      m.castShadow = true; m.receiveShadow = true; campusGroup.add(m);
    }
  });
  if (muted.length) {
    const prisms = muted.map((part) => {
      const h = (part.f || 2) * FH + 0.5;
      const geo = new THREE.ExtrudeGeometry(new THREE.Shape(part.p.map((p) => new THREE.Vector2(p[0], -p[1]))), { depth: h, bevelEnabled: false });
      geo.rotateX(-Math.PI / 2); return geo;
    });
    const dimWall = PAL.night ? 0x262a31 : 0xa9aeb5, dimRoof = PAL.night ? 0x1d2026 : 0x9ea3aa;
    const m = new THREE.Mesh(mergeGeos(prisms, true), [lambert(dimRoof), lambert(dimWall, { transparent: true, opacity: 0.82 })]);
    m.castShadow = true; m.receiveShadow = true; campusGroup.add(m);
  }
  buildTrees(c, obstacles);
}

// ---------- placeholder campus for schools still under construction (shown blurred) ----------
function placeholderCampus(id) {
  const rnd = mulberry32(hashStr(id));
  const S = 110;
  const box = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];

  return {

    roads: [{ k: 'ped', w: 9, pts: [[0, -S], [0, S]] }, { k: 'road', w: 6, pts: [[-S, 30], [S, 30]] }],

// 9. CAMERA (orbit / pan / zoom / pinch with smooth lerp)
// =========================================================================
const camState = {
  target: new THREE.Vector3(), goalTarget: new THREE.Vector3(),
  radius: 300, goalRadius: 300, phi: 0.82, goalPhi: 0.82, theta: 0, goalTheta: 0,
  isDragging: false, dragMode: 'orbit', prevX: 0, prevY: 0, downX: 0, downY: 0
};
function tuning() { return CAMPUS_TUNING[CAMPUS && CAMPUS.id] || CAMPUS_TUNING.wip; }
function renderCams() {
  const list = document.getElementById('cam-list');
  list.innerHTML = '';
  Object.keys(CAMPUS.cams).forEach((key) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cam-btn' + (key === state.activeCam ? ' on' : ''); b.dataset.cam = key;
    b.textContent = (CAMPUS.cam_labels || {})[key] || key;
    b.addEventListener('click', () => { if (state.droneOrbit) toggleDroneTour(false); flyToCameraPreset(key); });
    list.appendChild(b);
  });
}
function flyToCameraPreset(key, instant) {
  const p = CAMPUS.cams[key] || CAMPUS.cams.aerial_full;
  camState.goalTarget.set(...p.t);
  camState.goalRadius = p.r; camState.goalPhi = p.phi;
  // shortest turn to the preset heading
  const tw = Math.PI * 2; let th = p.th; while (th - camState.goalTheta > Math.PI) th -= tw; while (th - camState.goalTheta < -Math.PI) th += tw;
  camState.goalTheta = th;
  if (instant) { camState.target.copy(camState.goalTarget); camState.radius = p.r; camState.phi = p.phi; camState.theta = th; }
  state.activeCam = key;
  document.querySelectorAll('.cam-btn').forEach((btn) => btn.classList.toggle('on', btn.dataset.cam === key));
}
function clearCamActive() { state.activeCam = null; document.querySelectorAll('.cam-btn').forEach((btn) => btn.classList.remove('on')); }
function focusOnBuilding(id) {
  const B = BLD[id]; if (!B) return;
  camState.goalTarget.set(B.cx, Math.min(8, B.top * 0.35), B.cz);
  camState.goalRadius = Math.max(55, Math.min(220, B.r * 3.2 + B.top * 2));
  camState.goalPhi = 0.98;
  clearCamActive();
}
function clampTarget() {
  if (!CAMPUS || !CAMPUS.outline) return;
  const bb = campusBBox(CAMPUS), m = 40;
  camState.goalTarget.x = Math.max(bb[0] - m, Math.min(bb[1] + m, camState.goalTarget.x));
  camState.goalTarget.z = Math.max(bb[2] - m, Math.min(bb[3] + m, camState.goalTarget.z));
}

const domElem = renderer.domElement;
domElem.addEventListener('contextmenu', (e) => e.preventDefault());
const pointers = new Map();
let pinchDist = 0;
const pinchSpan = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
function dismissHint() { const h = document.getElementById('hint'); if (h && !h.classList.contains('gone')) h.classList.add('gone'); }

domElem.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  closePicker();
  if (pointers.size === 2) { pinchDist = pinchSpan(); camState.isDragging = false; return; }
  camState.isDragging = true;
  camState.prevX = camState.downX = e.clientX; camState.prevY = camState.downY = e.clientY;
  camState.dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
  if (state.droneOrbit) toggleDroneTour(false);
  dismissHint();
});
window.addEventListener('pointermove', (e) => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const span = pinchSpan();
    if (pinchDist > 0) camState.goalRadius = Math.max(30, Math.min(tuning().maxR, camState.goalRadius * pinchDist / span));
    pinchDist = span; tooltipEl.hidden = true; return;
  }
  if (camState.isDragging) {
    const dx = e.clientX - camState.prevX, dy = e.clientY - camState.prevY;
    camState.prevX = e.clientX; camState.prevY = e.clientY;
    if (camState.dragMode === 'orbit') {
      camState.goalTheta -= dx * 0.0065;
      camState.goalPhi = Math.max(0.18, Math.min(1.42, camState.goalPhi - dy * 0.0055));
    } else {
      const panSpeed = camState.radius * 0.0016;
      const fx = -Math.sin(camState.theta), fz = -Math.cos(camState.theta), rx = Math.cos(camState.theta), rz = -Math.sin(camState.theta);
      camState.goalTarget.x -= (rx * dx - fx * dy) * panSpeed;
      camState.goalTarget.z -= (rz * dx - fz * dy) * panSpeed;
      clampTarget();
    }
    if (Math.hypot(e.clientX - camState.downX, e.clientY - camState.downY) > 5) clearCamActive();
    tooltipEl.hidden = true; return;
  }
  if (e.target === domElem && e.pointerType === 'mouse') handlePointerHover(e);
  else tooltipEl.hidden = true;
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (!camState.isDragging) return;
  camState.isDragging = false;
  if (e.type === 'pointerup' && Math.hypot(e.clientX - camState.downX, e.clientY - camState.downY) < 5 && e.target === domElem && e.button === 0) handleViewportClick(e);
};
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
domElem.addEventListener('wheel', (e) => {
  e.preventDefault(); dismissHint();
  camState.goalRadius = Math.max(30, Math.min(tuning().maxR, camState.goalRadius * (1 + e.deltaY * 0.0011)));
  clearCamActive();
}, { passive: false });

const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
function getIntersectedBuilding(e) {
  const rect = domElem.getBoundingClientRect();
  mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouseNDC, camera);
  const hits = raycaster.intersectObjects(interactiveMeshes, false);
  return hits.length ? BLD[hits[0].object.userData.buildingId] : null;
}
function handlePointerHover(e) {
  const B = SCHOOL[state.uniId].ready ? getIntersectedBuilding(e) : null;
  if (B) {
    domElem.style.cursor = 'pointer';
    document.getElementById('tooltip-code').textContent = B.data.code;
    document.getElementById('tooltip-name').textContent = B.data.name;
    document.getElementById('tooltip-sub').textContent = (B.data.where || ZONE_LABEL[B.data.zone]) + '・點一下看介紹';
    tooltipEl.hidden = false;
    const w = tooltipEl.offsetWidth;
    tooltipEl.style.left = `${Math.min(window.innerWidth - w - 12, e.clientX + 16)}px`;
    tooltipEl.style.top = `${Math.max(12, e.clientY - 56)}px`;
  } else { domElem.style.cursor = ''; tooltipEl.hidden = true; }
}

function sizeMinimap() {

  const s = Math.min((MW - pad * 2) / ww, (MH - pad * 2) / hh);
  MAP_T = { s, ox: (MW - ww * s) / 2 - bb[0] * s, oy: (MH - hh * s) / 2 - bb[2] * s };
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

let mapBase = null, mapBaseKey = '';
function drawMinimap() {

  if (key !== mapBaseKey) { drawMinimapBase(); mapBaseKey = key; }
  const { s, ox, oy } = MAP_T, X = (x) => ox + x * s, Y = (z) => oy + z * s;
  const path = (poly) => { mCtx.beginPath(); poly.forEach(([x, z], i) => (i ? mCtx.lineTo(X(x), Y(z)) : mCtx.moveTo(X(x), Y(z)))); mCtx.closePath(); };
  mCtx.clearRect(0, 0, MW, MH);
  mCtx.drawImage(mapBase, 0, 0, MW, MH);
  const selB = CAMPUS.buildings.find((b) => b.id === state.selectedId);
  if (selB) { mCtx.fillStyle = MAPC.accent; selB.parts.forEach((p) => { path(partPoly(p)); mCtx.fill(); }); }

function drawMinimapBase() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  mapBase.width = MW * dpr; mapBase.height = MH * dpr;
  const mCtx = mapBase.getContext('2d'); mCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { s, ox, oy } = MAP_T, X = (x) => ox + x * s, Y = (z) => oy + z * s;
  const path = (poly) => { mCtx.beginPath(); poly.forEach(([x, z], i) => (i ? mCtx.lineTo(X(x), Y(z)) : mCtx.moveTo(X(x), Y(z)))); mCtx.closePath(); };
  mCtx.clearRect(0, 0, MW, MH);

  mCtx.fillStyle = MAPC.bld; mCtx.globalAlpha = 0.35; (CAMPUS.city || []).forEach((p) => { path(p.p); mCtx.fill(); }); mCtx.globalAlpha = 1;
  mCtx.fillStyle = MAPC.turf; mCtx.globalAlpha = 0.35; (CAMPUS.mutedOutlines || []).forEach((o) => { path(o); mCtx.fill(); }); mCtx.globalAlpha = 1;

    mCtx.strokeStyle = r.k === 'ped' ? MAPC.accent : MAPC.road; mCtx.globalAlpha = r.k === 'ped' ? 0.55 : 1;
    if (r.k === 'path') { mCtx.strokeStyle = MAPC.road; mCtx.globalAlpha = 0.35; }
    mCtx.lineWidth = Math.max(r.k === 'arterial' || r.k === 'elevated' ? 2.4 : r.k === 'path' ? 0.5 : 1, r.w * s);
    mCtx.beginPath(); r.pts.forEach(([x, z], i) => (i ? mCtx.lineTo(X(x), Y(z)) : mCtx.moveTo(X(x), Y(z)))); mCtx.stroke();
  });
  mCtx.globalAlpha = 1;
  mCtx.fillStyle = MAPC.water; (CAMPUS.water || []).forEach((w) => { path(w.poly); mCtx.fill(); });
  mCtx.strokeStyle = MAPC.water; (CAMPUS.creeks || []).forEach((c) => { mCtx.lineWidth = Math.max(1, c.w * s); mCtx.beginPath(); c.pts.forEach(([x, z], i) => (i ? mCtx.lineTo(X(x), Y(z)) : mCtx.moveTo(X(x), Y(z)))); mCtx.stroke(); });
  mCtx.fillStyle = MAPC.bld; mCtx.globalAlpha = 0.55; (CAMPUS.context || []).forEach((p) => { path(p.p); mCtx.fill(); }); mCtx.globalAlpha = 1;
  CAMPUS.buildings.forEach((b) => {
    const dim = (state.selectedZone !== 'all' && b.zone !== state.selectedZone) || (CAMPUS.active && b.school && b.school !== CAMPUS.active);
    mCtx.globalAlpha = dim ? 0.35 : 1;
    mCtx.fillStyle = MAPC.bld;
    b.parts.forEach((p) => { if (p.f !== 0 || b.kind) { path(partPoly(p)); mCtx.fill(); } });

}
function drawMinimapOverlay(mCtx, X, Y, s) {
  if (state.selectedId && BLD[state.selectedId]) {
    const B = BLD[state.selectedId];
    mCtx.strokeStyle = MAPC.ink; mCtx.lineWidth = 1.5;
    mCtx.strokeRect(X(B.bbox[0]) - 3, Y(B.bbox[2]) - 3, (B.bbox[1] - B.bbox[0]) * s + 6, (B.bbox[3] - B.bbox[2]) * s + 6);
  }
  // camera marker with view wedge
  const cx = X(camState.target.x), cy = Y(camState.target.z), a = -camState.theta - Math.PI / 2;
  mCtx.fillStyle = MAPC.accent; mCtx.globalAlpha = 0.22;
  mCtx.beginPath(); mCtx.moveTo(cx, cy); mCtx.arc(cx, cy, 26, a - 0.5, a + 0.5); mCtx.closePath(); mCtx.fill();
  mCtx.globalAlpha = 1; mCtx.strokeStyle = MAPC.accent; mCtx.lineWidth = 2;
  mCtx.beginPath(); mCtx.arc(cx, cy, 5, 0, Math.PI * 2); mCtx.stroke();
  mCtx.beginPath(); mCtx.arc(cx, cy, 1.8, 0, Math.PI * 2); mCtx.fill();
}
minimapCanvas.addEventListener('click', (e) => {

function updateSun() {
  const ext = Math.max(70, Math.min(380, camState.radius * 0.85));

  sunLight.position.copy(camState.target).setY(0).addScaledVector(sunDir, 600);

function layoutLabels() {
  const halfW = window.innerWidth / 2, halfH = window.innerHeight / 2;
  const placed = [];
  const cand = [];
  labelElements.forEach((item) => {
    if (item.el.style.display === 'none') return;
    const B = BLD[item.id];
    tempV.set(B.cx, B.top + 1.2, B.cz).project(camera);
    if (tempV.z > 1 || Math.abs(tempV.x) > 1.1 || Math.abs(tempV.y) > 1.1) { item.el.style.opacity = '0'; item.el.style.pointerEvents = 'none'; return; }
    cand.push({ item, x: tempV.x * halfW + halfW, y: -tempV.y * halfH + halfH, depth: tempV.z, p: item.id === state.selectedId ? 99 : item.prio });
  });
  cand.sort((a, b) => b.p - a.p || a.depth - b.depth);
  cand.forEach((c) => {
    const w = c.item.w || 90, h = (c.item.h || 24) + 9;
    const r = [c.x - w / 2 - 3, c.y - h - 2, c.x + w / 2 + 3, c.y];
    const clash = c.p < 99 && placed.some((q) => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1]);
    if (clash) { c.item.el.style.opacity = '0'; c.item.el.style.pointerEvents = 'none'; return; }
    placed.push(r);
    c.item.el.style.transform = `translate3d(${c.x.toFixed(1)}px,${c.y.toFixed(1)}px,0)`;
    c.item.el.style.opacity = '1'; c.item.el.style.pointerEvents = 'auto';
  });

    if (r.el.style.display === 'none') return;
    tempV.set(r.p[0], 0.5, r.p[1]).project(camera);
    if (tempV.z > 1) { r.el.style.opacity = '0'; return; }
    const x = tempV.x * halfW + halfW, y = -tempV.y * halfH + halfH;
    const clash = placed.some((q) => x > q[0] - 40 && x < q[2] + 40 && y > q[1] - 10 && y < q[3] + 10);
    r.el.style.opacity = clash ? '0' : '0.95';

  });

function animate(now) {

  const k = 0.085;

  camState.radius += (camState.goalRadius - camState.radius) * k;
  camState.phi += (camState.goalPhi - camState.phi) * k;
  camState.theta += (camState.goalTheta - camState.theta) * k;
  const sinPhi = Math.sin(camState.phi);

    camState.target.x + camState.radius * sinPhi * Math.sin(camState.theta),
    camState.target.y + camState.radius * Math.cos(camState.phi),
    camState.target.z + camState.radius * sinPhi * Math.cos(camState.theta));
  camera.lookAt(camState.target);
  compassEl.style.transform = `rotate(${camState.theta}rad)`;
  updateSun();
  if (selectionRing.visible) selectionRing.material.opacity = 0.55 + Math.sin(t * 4) * 0.35;
  animatedJets.forEach((j) => { j.scale.y = 1 + Math.sin(t * 5 + j.userData.phase) * 0.25; });

    const u = car.userData; u.d += u.v * u.dir; if (u.d > u.L) u.d -= u.L; if (u.d < 0) u.d += u.L;
